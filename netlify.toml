# Netlify configuration for Robot.com landing pages
# Public folders: /that-day-is-here/, /dasboards/, /nacas/
# Blocked folders: /emails/, /components/, /lead-qualification-form/
# /docs/ is local-only (not in GitHub)

[build]
  publish = "."
  command = "cd events && npm install --no-audit --no-fund && npm run build && cd ../humanoid-task-glossary && npm install --no-audit --no-fund && npm run build"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================
# Automate 2026 · lp.robot.com/automate (Booth 1592)
# Event-mode QR capture -> TrueList -> deep-research enrichment -> HubSpot.
# Clean URL for the QR (no 301 hop).
# ============================================
# --- Documentacion interna: no debe servirse publicamente ---
# publish = "." publica el repositorio entero, asi que todo .md queda expuesto
# salvo que se bloquee aqui. Netlify solo admite splat al final de una ruta,
# no comodines de extension, por eso las rutas van explicitas.
# Verificado el 2026-08-19: los 20 archivos de abajo respondian 200 en produccion.
# Al agregar documentacion nueva al repositorio, agregar aqui su bloqueo en el mismo commit.

[[redirects]]
