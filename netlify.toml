# Expose the events sitemap at the conventional /sitemap.xml so crawlers find
# it without needing to read robots.txt first. Targets the built file directly
# because Netlify rewrites don't chain — `to = "/events/sitemap.xml"` would
# otherwise hit no real file and 404.
[[redirects]]
  from = "/sitemap.xml"
  to = "/events/dist/sitemap.xml"
  status = 200
  force = true

