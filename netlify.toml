  from = "/feeds/conversions.csv"
  to = "/.netlify/functions/conversion-feed"
  status = 200
  force = true

[[redirects]]
  from = "/feeds/qualified-leads.csv"
  to = "/.netlify/functions/qualified-leads-feed"
  status = 200
  force = true

# ============================================================
# R-Noid lead widget · lp.robot.com/rnoid/
# Loader embebible (v1.js) + form (modal.html). Se pega en cualquier pagina
# host con <script src=".../rnoid/v1.js"> + botones class="cta-rnoid".
# modal.html se sirve dentro de un iframe en dominios de terceros -> hay que
# permitir framing (override del X-Frame-Options DENY global de abajo) y dejar
# cache corto para poder iterar el form sin que el host toque nada.
# ============================================================
[[redirects]]
  from = "/hooks/cal-rnoid"
  to = "/.netlify/functions/cal-webhook"
  status = 200
  force = true

# ============================================
# Humanoid Task Glossary · lp.robot.com/humanoid-task-glossary/
# Subproyecto Vite + React compilado en deploy hacia humanoid-task-glossary/dist/.
# Publico e indexable: a diferencia del resto de superficies internas, no lleva
# X-Robots-Tag. Los 33 videos se sirven desde dist/videos/ con nombres estables
# (sin hash), para que Netlify los deduplique entre deploys.
# ============================================
[[redirects]]
  from = "/humanoid-task-glossary"
  to = "/humanoid-task-glossary/dist/"
  status = 200
  force = true

[[redirects]]
  from = "/humanoid-task-glossary/*"
  to = "/humanoid-task-glossary/dist/:splat"
  status = 200
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# R-Noid iframe widget: override the global DENY rule above.
[[headers]]
  for = "/rnoid/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    Cache-Control = "public, max-age=60, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Dashboards: Allow embeds (Notion) and prevent Google indexing
[[headers]]
  for = "/dasboards/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ============================================
# Ads Gallery - Hidden from search engines
# ============================================
[[headers]]
  for = "/ads-gallery/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
